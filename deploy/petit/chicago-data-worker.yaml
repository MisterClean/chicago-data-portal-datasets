id: chicago_data_worker
name: chicago-data-worker
enabled: true
schedule:
  cron: "0 3 8,14,18 * * MON-FRI"
  timezone: America/Chicago
max_concurrency: 1
tasks:
  - id: execute
    type: command
    command: /usr/bin/systemctl
    args: [start, --wait, chicago-data-bot.service]
    working_dir: /tmp
    timeout_secs: 960
    retry:
      max_attempts: 0
      delay_secs: 0
      condition: never
