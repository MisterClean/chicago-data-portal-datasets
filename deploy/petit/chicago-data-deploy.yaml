id: chicago_data_deploy
name: chicago-data-deploy
enabled: true
schedule:
  cron: "0 11,26,41,56 * * * *"
  timezone: UTC
max_concurrency: 1
tasks:
  - id: execute
    type: command
    command: /usr/bin/systemctl
    args: [start, --wait, chicago-data-bot-deploy.service]
    working_dir: /tmp
    timeout_secs: 360
    retry:
      max_attempts: 0
      delay_secs: 0
      condition: never
