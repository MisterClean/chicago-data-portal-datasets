id: chicago_data_backup
name: chicago-data-backup
enabled: true
schedule:
  cron: "0 47 4 * * *"
  timezone: UTC
max_concurrency: 1
tasks:
  - id: execute
    type: command
    command: /usr/bin/systemctl
    args: [start, --wait, chicago-data-bot-backup.service]
    working_dir: /tmp
    timeout_secs: 210
    retry:
      max_attempts: 0
      delay_secs: 0
      condition: never
