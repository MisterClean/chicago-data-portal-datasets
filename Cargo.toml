[package]
name = "chicago-data-bot"
version = "0.1.0"
edition = "2024"
default-run = "chicago-data-bot"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
fontdue = "0.9"
fs2 = "0.4"
html2text = "0.16"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
